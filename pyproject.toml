[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xense-motion-viewer"
version = "0.5.0"
description = "Robot motion workbench with read-only live policy/state visualization and offline Elite tools"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3"]

[project.urls]
Repository = "https://github.com/XenseRobotics-AI/xense-motion-viewer"

[project.optional-dependencies]
rerun = ["rerun-sdk==0.26.2", "trimesh==5.1.1", "pycollada==0.9.3"]
elite = ["libpyelite==0.1.0", "PyYAML>=6"]
qt = ["PySide6>=6.6,<7"]
test = ["pytest>=8"]

[project.scripts]
xmv-elite-record = "xense_motion_viewer.adapters.elite:record_main"
xmv-elite-qt = "xense_motion_viewer.adapters.elite:qt_main"
xmv-elite-policy = "xense_motion_viewer.adapters.elite_policy:main"
xmv-policy-replay = "xense_motion_viewer.adapters.elite_policy:replay_main"

[tool.setuptools.package-data]
xense_motion_viewer = ["assets/*.npz"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["elite: requires the source-backed libpyelite native installation"]
